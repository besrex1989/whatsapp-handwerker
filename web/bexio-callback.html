<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bexio verbinden — WhatsBill</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#25D366">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:locale" content="de_CH">
  <meta property="og:site_name" content="WhatsBill">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bexio verbinden — WhatsBill">
  <style>
    body { font-family: sans-serif; text-align: center; padding: 60px 20px; }
    .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #ccc; border-top-color: #25D366; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .debug { margin-top: 30px; text-align: left; background: #f5f5f5; padding: 15px; border-radius: 8px; word-break: break-all; font-size: 12px; max-width: 600px; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 id="status">Bexio wird verbunden...</h2>
  <p id="detail">Bitte warten.</p>
  <div id="debug" class="debug" style="display:none;"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (async function() {
      // Check query params AND hash fragment (some OAuth providers use fragments)
      var params = new URLSearchParams(window.location.search);
      var hashParams = new URLSearchParams(window.location.hash.replace("#", "?"));

      var code = params.get("code") || hashParams.get("code");
      var state = params.get("state") || hashParams.get("state");
      var error = params.get("error") || hashParams.get("error");
      var errorDesc = params.get("error_description") || hashParams.get("error_description");

      // Show debug info if something went wrong
      if (error || (!code && !state)) {
        document.querySelector(".spinner").style.display = "none";
        document.getElementById("status").textContent = "Fehler";

        if (error) {
          document.getElementById("detail").textContent = error + ": " + (errorDesc || "Unbekannter Fehler");
        } else {
          document.getElementById("detail").textContent = "Fehlende Parameter. Bitte versuche es erneut.";
        }

        // Show debug info
        var debugEl = document.getElementById("debug");
        debugEl.style.display = "block";
        debugEl.innerHTML = "<strong>Debug:</strong><br>"
          + "URL: " + window.location.href + "<br>"
          + "Search: " + window.location.search + "<br>"
          + "Hash: " + window.location.hash;
        return;
      }

      function showError(title, detail) {
        document.querySelector(".spinner").style.display = "none";
        document.getElementById("status").textContent = title;
        document.getElementById("detail").textContent = detail;
      }

      // Die Edge Function verlangt die Anmeldung des Tenant-Besitzers. Wir
      // lesen die Session, die das Dashboard auf derselben Domain angelegt
      // hat. Bewusst NICHT js/auth.js laden: dessen Client wertet die URL
      // aus (detectSessionInUrl) und würde bei einem Bexio-Fehler
      // (?error=…&error_description=…) die Session verwerfen. Werte
      // identisch zu js/auth.js (der anon-Key ist öffentlich).
      var SUPABASE_URL = "https://rdbislocgdraggiapxod.supabase.co";
      var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkYmlzbG9jZ2RyYWdnaWFweG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MDk2NDIsImV4cCI6MjA5MTQ4NTY0Mn0.xreLK3j-9rgW1xPS7G9-WCW7JqQiEgTdHTKsgUeEUJs";
      var accessToken = null;
      try {
        var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { detectSessionInUrl: false },
        });
        var sessionResult = await client.auth.getSession();
        accessToken = sessionResult.data && sessionResult.data.session
          ? sessionResult.data.session.access_token
          : null;
      } catch (sessErr) {
        console.error("[bexio-callback] session error:", sessErr);
      }

      if (!accessToken) {
        showError(
          "Nicht angemeldet",
          "Bexio konnte nicht verbunden werden, weil du in diesem Browser nicht bei WhatsBill angemeldet bist. "
            + "Bitte melde dich an und klicke im Dashboard erneut auf «Bexio verbinden»."
        );
        var loginLink = document.createElement("p");
        loginLink.innerHTML = '<a href="/login.html">Zur Anmeldung</a>';
        document.getElementById("detail").after(loginLink);
        return;
      }

      // Call Supabase Edge Function to exchange code for tokens
      var supabaseUrl = SUPABASE_URL + "/functions/v1/bexio-oauth";
      var callbackUrl = window.location.origin + window.location.pathname;
      var fetchUrl = supabaseUrl
        + "?code=" + encodeURIComponent(code)
        + "&state=" + encodeURIComponent(state)
        + "&redirect_uri=" + encodeURIComponent(callbackUrl);

      try {
        var resp = await fetch(fetchUrl, {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + accessToken,
          },
        });
        document.querySelector(".spinner").style.display = "none";
        if (resp.ok) {
          document.getElementById("status").textContent = "Bexio erfolgreich verbunden!";
          document.getElementById("detail").textContent = "Du wirst in Kürze zum Dashboard weitergeleitet...";
          // Auto-redirect back to the dashboard. The tenant row was just
          // updated by bexio-oauth (access_token + refresh_token), so the
          // dashboard will render the "Verbunden" badge on next load.
          setTimeout(function () {
            window.location.href = "/dashboard.html";
          }, 1500);
        } else {
          var errText = await resp.text();
          // Fehler kommen als JSON { error } oder (ältere Pfade) als Text.
          try {
            var errJson = JSON.parse(errText);
            if (errJson && errJson.error) errText = errJson.error;
          } catch (_e) { /* plain text */ }
          if (resp.status === 401) {
            errText = "Deine Anmeldung ist abgelaufen. Bitte melde dich neu an und klicke im Dashboard erneut auf «Bexio verbinden».";
          } else if (resp.status === 403) {
            errText = "Diese Bexio-Anfrage gehört zu einem anderen WhatsBill-Konto. Bitte im Dashboard erneut auf «Bexio verbinden» klicken.";
          }
          document.getElementById("status").textContent = "Fehler bei der Verbindung";
          document.getElementById("detail").textContent = errText || "Bitte versuche es erneut.";
        }
      } catch (err) {
        document.querySelector(".spinner").style.display = "none";
        document.getElementById("status").textContent = "Netzwerkfehler";
        document.getElementById("detail").textContent = err.message;
      }
    })();
  </script>
</body>
</html>
